<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e" />
      <stop offset="100%" stop-color="#060b11" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)" />
  <circle cx="700" cy="150" r="140" fill="#38bdf8" opacity="0.08" filter="blur(40px)" />

  <g transform="translate(60, 45)">
    <rect width="680" height="360" rx="12" fill="#0d1526" stroke="#1e293b" stroke-width="1.5" />
    <line x1="0" y1="40" x2="680" y2="40" stroke="#1e293b" stroke-width="1" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <text x="340" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">uikit-library.vercel.app</text>

    <!-- Component Buttons & Cards showcase -->
    <g transform="translate(40, 70)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#3b82f6" />
      <text x="80" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Primary Action</text>

      <rect x="180" y="0" width="160" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="260" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">Secondary Action</text>

      <rect x="360" y="0" width="160" height="40" rx="8" fill="#8c1123" />
      <text x="440" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Crimson Accent</text>
    </g>

    <!-- Input & Toggle Mockup -->
    <g transform="translate(40, 140)">
      <rect x="0" y="0" width="280" height="44" rx="8" fill="#0b1324" stroke="#334155" />
      <text x="15" y="27" fill="#64748b" font-family="sans-serif" font-size="12">Search components...</text>

      <rect x="310" y="0" width="70" height="40" rx="20" fill="#10b981" />
      <circle cx="355" cy="20" r="15" fill="#ffffff" />
      <text x="400" y="25" fill="#94a3b8" font-family="sans-serif" font-size="12">Interactive State</text>
    </g>

    <!-- Badge Pills -->
    <g transform="translate(40, 220)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" />
      <text x="40" y="17" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">React 18</text>

      <rect x="95" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#818cf8" />
      <text x="145" y="17" fill="#818cf8" font-family="sans-serif" font-size="10" text-anchor="middle">Tailwind CSS</text>

      <rect x="210" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#34d399" />
      <text x="260" y="17" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">WCAG 2.1 AA</text>

      <rect x="325" y="0" width="90" height="26" rx="13" fill="#1e293b" stroke="#f43f5e" />
      <text x="370" y="17" fill="#f43f5e" font-family="sans-serif" font-size="10" text-anchor="middle">Zero Dep</text>
    </g>
  </g>
</svg>

