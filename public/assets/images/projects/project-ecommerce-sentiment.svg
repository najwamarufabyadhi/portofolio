<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSvm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B11" />
      <stop offset="50%" stop-color="#061f1d" />
      <stop offset="100%" stop-color="#020807" />
    </linearGradient>
    <linearGradient id="tealEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgSvm)" />
  <circle cx="680" cy="100" r="150" fill="#14b8a6" opacity="0.08" filter="blur(40px)" />
  <circle cx="120" cy="360" r="150" fill="#10b981" opacity="0.08" filter="blur(40px)" />

  <!-- App Window Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="360" rx="12" fill="#041210" stroke="#0e3d37" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <line x1="0" y1="40" x2="680" y2="40" stroke="#0e3d37" stroke-width="1" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="210" y="11" width="260" height="18" rx="6" fill="#020807" stroke="#0e3d37" />
    <text x="340" y="24" fill="#5eead4" font-family="monospace" font-size="10" text-anchor="middle">ecommerce-sentiment-svm.analytics</text>

    <!-- Top KPI Badges -->
    <rect x="25" y="55" width="145" height="65" rx="8" fill="#08201c" stroke="#124f46" stroke-width="1" />
    <text x="38" y="74" fill="#99f6e4" font-family="sans-serif" font-size="10">SVM ACCURACY</text>
    <text x="38" y="102" fill="#34d399" font-family="monospace" font-size="19" font-weight="bold">86.00%</text>

    <rect x="185" y="55" width="145" height="65" rx="8" fill="#08201c" stroke="#124f46" stroke-width="1" />
    <text x="198" y="74" fill="#99f6e4" font-family="sans-serif" font-size="10">VECTORIZER</text>
    <text x="198" y="102" fill="#2dd4bf" font-family="monospace" font-size="17" font-weight="bold">TF-IDF</text>

    <rect x="345" y="55" width="145" height="65" rx="8" fill="#08201c" stroke="#124f46" stroke-width="1" />
    <text x="358" y="74" fill="#99f6e4" font-family="sans-serif" font-size="10">KERNEL</text>
    <text x="358" y="102" fill="#e6edf3" font-family="monospace" font-size="16" font-weight="bold">Linear / RBF</text>

    <rect x="505" y="55" width="150" height="65" rx="8" fill="#08201c" stroke="#124f46" stroke-width="1" />
    <text x="518" y="74" fill="#99f6e4" font-family="sans-serif" font-size="10">REVIEWS ANALYZED</text>
    <text x="518" y="102" fill="#facc15" font-family="monospace" font-size="16" font-weight="bold">Multi-Category</text>

    <!-- Scatter Plot / Hyperplane Visualization -->
    <rect x="25" y="135" width="370" height="200" rx="8" fill="#061815" stroke="#0e3d37" stroke-width="1" />
    <text x="40" y="160" fill="#5eead4" font-family="monospace" font-size="11" font-weight="bold">SVM HYPERPLANE &amp; SUPPORT VECTORS</text>
    
    <g transform="translate(40, 175)">
      <!-- Axis lines -->
      <line x1="10" y1="120" x2="330" y2="120" stroke="#124f46" stroke-width="1" />
      <line x1="10" y1="10" x2="10" y2="120" stroke="#124f46" stroke-width="1" />

      <!-- Hyperplane dividing line -->
      <line x1="30" y1="110" x2="310" y2="20" stroke="#2dd4bf" stroke-width="2" />
      <!-- Margin dashed lines -->
      <line x1="15" y1="110" x2="295" y2="20" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
      <line x1="45" y1="110" x2="325" y2="20" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />

      <!-- Positive points (Green) -->
      <circle cx="210" cy="40" r="4" fill="#34d399" />
      <circle cx="240" cy="30" r="4" fill="#34d399" />
      <circle cx="270" cy="50" r="4" fill="#34d399" />
      <circle cx="220" cy="70" r="4" fill="#34d399" />
      <circle cx="290" cy="35" r="4" fill="#34d399" />

      <!-- Negative points (Red / Orange) -->
      <circle cx="60" cy="90" r="4" fill="#f87171" />
      <circle cx="90" cy="100" r="4" fill="#f87171" />
      <circle cx="120" cy="85" r="4" fill="#f87171" />
      <circle cx="80" cy="70" r="4" fill="#f87171" />
      <circle cx="140" cy="95" r="4" fill="#f87171" />
    </g>

    <!-- Sentiment Breakdown Card -->
    <rect x="410" y="135" width="245" height="200" rx="8" fill="#061815" stroke="#0e3d37" stroke-width="1" />
    <text x="425" y="160" fill="#5eead4" font-family="monospace" font-size="11" font-weight="bold">SENTIMENT DISTRIBUTION</text>

    <g transform="translate(425, 175)">
      <text x="0" y="15" fill="#34d399" font-family="monospace" font-size="10">POSITIVE FEEDBACK (74.8%)</text>
      <rect x="0" y="22" width="215" height="8" rx="4" fill="#134e4a" />
      <rect x="0" y="22" width="160" height="8" rx="4" fill="#34d399" />

      <text x="0" y="55" fill="#f87171" font-family="monospace" font-size="10">NEGATIVE / CRITICISM (25.2%)</text>
      <rect x="0" y="62" width="215" height="8" rx="4" fill="#134e4a" />
      <rect x="0" y="62" width="55" height="8" rx="4" fill="#f87171" />

      <text x="0" y="115" fill="#2dd4bf" font-family="monospace" font-size="10">● Model: SVM (Scikit-Learn)</text>
      <text x="0" y="129" fill="#99f6e4" font-family="sans-serif" font-size="9">TF-IDF Vectorized Feature Weighting</text>
    </g>
  </g>
</svg>