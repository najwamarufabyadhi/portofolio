<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAttend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B11" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#03070d" />
    </linearGradient>
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgAttend)" />
  <circle cx="680" cy="100" r="150" fill="#0284c7" opacity="0.08" filter="blur(40px)" />
  <circle cx="120" cy="360" r="150" fill="#2563eb" opacity="0.08" filter="blur(40px)" />

  <!-- App Window Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="360" rx="12" fill="#09131f" stroke="#172b42" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <line x1="0" y1="40" x2="680" y2="40" stroke="#172b42" stroke-width="1" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="210" y="11" width="260" height="18" rx="6" fill="#030712" stroke="#172b42" />
    <text x="340" y="24" fill="#79c0ff" font-family="monospace" font-size="10" text-anchor="middle">attendance-hub.internal.dev</text>

    <!-- Top KPI Badges -->
    <rect x="25" y="55" width="145" height="65" rx="8" fill="#0f1f33" stroke="#1d3d63" stroke-width="1" />
    <text x="38" y="74" fill="#94a3b8" font-family="sans-serif" font-size="10">AUTH SECURITY</text>
    <text x="38" y="102" fill="#38bdf8" font-family="monospace" font-size="17" font-weight="bold">RBAC Auth</text>

    <rect x="185" y="55" width="145" height="65" rx="8" fill="#0f1f33" stroke="#1d3d63" stroke-width="1" />
    <text x="198" y="74" fill="#94a3b8" font-family="sans-serif" font-size="10">DATABASE</text>
    <text x="198" y="102" fill="#60a5fa" font-family="monospace" font-size="17" font-weight="bold">MySQL 8.0</text>

    <rect x="345" y="55" width="145" height="65" rx="8" fill="#0f1f33" stroke="#1d3d63" stroke-width="1" />
    <text x="358" y="74" fill="#94a3b8" font-family="sans-serif" font-size="10">TRACKING</text>
    <text x="358" y="102" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">Timestamped</text>

    <rect x="505" y="55" width="150" height="65" rx="8" fill="#0f1f33" stroke="#1d3d63" stroke-width="1" />
    <text x="518" y="74" fill="#94a3b8" font-family="sans-serif" font-size="10">ROLE TIERS</text>
    <text x="518" y="102" fill="#facc15" font-family="monospace" font-size="16" font-weight="bold">Admin &amp; Staff</text>

    <!-- Attendance Log Table Simulation -->
    <rect x="25" y="135" width="370" height="200" rx="8" fill="#0a1524" stroke="#16293f" stroke-width="1" />
    <text x="40" y="160" fill="#79c0ff" font-family="monospace" font-size="11" font-weight="bold">LIVE EMPLOYEE CHECK-IN ROSTER</text>
    
    <g transform="translate(40, 175)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="340" height="32" rx="4" fill="#12243a" />
      <circle cx="16" cy="16" r="4" fill="#34d399" />
      <text x="30" y="20" fill="#f1f5f9" font-family="sans-serif" font-size="10">Najwa Maruf</text>
      <text x="140" y="20" fill="#94a3b8" font-family="monospace" font-size="9">08:02:14 AM</text>
      <rect x="250" y="7" width="75" height="18" rx="4" fill="#065f46" />
      <text x="287" y="19" fill="#a7f3d0" font-family="monospace" font-size="8" text-anchor="middle">ON TIME</text>

      <!-- Row 2 -->
      <rect x="0" y="38" width="340" height="32" rx="4" fill="#0d1b2b" />
      <circle cx="16" cy="54" r="4" fill="#34d399" />
      <text x="30" y="58" fill="#f1f5f9" font-family="sans-serif" font-size="10">Dev Ops Lead</text>
      <text x="140" y="58" fill="#94a3b8" font-family="monospace" font-size="9">08:15:30 AM</text>
      <rect x="250" y="45" width="75" height="18" rx="4" fill="#065f46" />
      <text x="287" y="57" fill="#a7f3d0" font-family="monospace" font-size="8" text-anchor="middle">ON TIME</text>

      <!-- Row 3 -->
      <rect x="0" y="76" width="340" height="32" rx="4" fill="#12243a" />
      <circle cx="16" cy="92" r="4" fill="#38bdf8" />
      <text x="30" y="96" fill="#f1f5f9" font-family="sans-serif" font-size="10">Frontend Dev</text>
      <text x="140" y="96" fill="#94a3b8" font-family="monospace" font-size="9">08:29:45 AM</text>
      <rect x="250" y="83" width="75" height="18" rx="4" fill="#1e3a5f" />
      <text x="287" y="95" fill="#7dd3fc" font-family="monospace" font-size="8" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Schema & Access Control Card -->
    <rect x="410" y="135" width="245" height="200" rx="8" fill="#0a1524" stroke="#16293f" stroke-width="1" />
    <text x="425" y="160" fill="#79c0ff" font-family="monospace" font-size="11" font-weight="bold">SCHEMA &amp; ACCESS CONTROL</text>

    <g transform="translate(425, 175)">
      <rect x="0" y="0" width="215" height="36" rx="6" fill="#112238" stroke="#1e3a5f" />
      <text x="12" y="16" fill="#94a3b8" font-family="monospace" font-size="9">TABLE: users (id, role, hash)</text>
      <text x="12" y="28" fill="#38bdf8" font-family="monospace" font-size="8">Role-based privileges: Admin/Emp</text>

      <rect x="0" y="44" width="215" height="36" rx="6" fill="#112238" stroke="#1e3a5f" />
      <text x="12" y="60" fill="#94a3b8" font-family="monospace" font-size="9">TABLE: attendance_records</text>
      <text x="12" y="72" fill="#34d399" font-family="monospace" font-size="8">Check-in, Check-out, Geostamp</text>

      <text x="0" y="115" fill="#60a5fa" font-family="monospace" font-size="10">● Stack: MySQL &amp; Full Stack</text>
      <text x="0" y="129" fill="#94a3b8" font-family="sans-serif" font-size="9">Automated Session &amp; Audit Logs</text>
    </g>
