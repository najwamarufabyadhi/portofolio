<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLstm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B11" />
      <stop offset="50%" stop-color="#140a25" />
      <stop offset="100%" stop-color="#040208" />
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgLstm)" />
  <circle cx="680" cy="100" r="150" fill="#a855f7" opacity="0.08" filter="blur(40px)" />
  <circle cx="120" cy="360" r="150" fill="#ec4899" opacity="0.08" filter="blur(40px)" />

  <!-- App Window Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="360" rx="12" fill="#0c0717" stroke="#291642" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <line x1="0" y1="40" x2="680" y2="40" stroke="#291642" stroke-width="1" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="210" y="11" width="260" height="18" rx="6" fill="#040209" stroke="#291642" />
    <text x="340" y="24" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">lstm-cyberbullying-nlp.engine</text>

    <!-- Top KPI Badges -->
    <rect x="25" y="55" width="145" height="65" rx="8" fill="#160d29" stroke="#3b1d63" stroke-width="1" />
    <text x="38" y="74" fill="#a1a1aa" font-family="sans-serif" font-size="10">MODEL ACCURACY</text>
    <text x="38" y="102" fill="#ec4899" font-family="monospace" font-size="19" font-weight="bold">93.00%</text>

    <rect x="185" y="55" width="145" height="65" rx="8" fill="#160d29" stroke="#3b1d63" stroke-width="1" />
    <text x="198" y="74" fill="#a1a1aa" font-family="sans-serif" font-size="10">RECURRENT ARCH</text>
    <text x="198" y="102" fill="#c084fc" font-family="monospace" font-size="17" font-weight="bold">Bi-LSTM</text>

    <rect x="345" y="55" width="145" height="65" rx="8" fill="#160d29" stroke="#3b1d63" stroke-width="1" />
    <text x="358" y="74" fill="#a1a1aa" font-family="sans-serif" font-size="10">EMBEDDING DIM</text>
    <text x="358" y="102" fill="#e4e4e7" font-family="monospace" font-size="16" font-weight="bold">128 Vectors</text>

    <rect x="505" y="55" width="150" height="65" rx="8" fill="#160d29" stroke="#3b1d63" stroke-width="1" />
    <text x="518" y="74" fill="#a1a1aa" font-family="sans-serif" font-size="10">NLP PIPELINE</text>
    <text x="518" y="102" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">Tokenized</text>

    <!-- NLP Flow & Recurrent Gate Diagram -->
    <rect x="25" y="135" width="370" height="200" rx="8" fill="#0f071d" stroke="#2a1545" stroke-width="1" />
    <text x="40" y="160" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">RECURRENT MEMORY CELLS &amp; GATING</text>
    
    <!-- Token Sequence flow -->
    <g transform="translate(40, 175)">
      <rect x="0" y="0" width="70" height="30" rx="4" fill="#201138" stroke="#4a2278" />
      <text x="35" y="19" fill="#f43f5e" font-family="monospace" font-size="10" text-anchor="middle">[Token_t-1]</text>

      <rect x="85" y="0" width="70" height="30" rx="4" fill="#201138" stroke="#4a2278" />
      <text x="120" y="19" fill="#e879f9" font-family="monospace" font-size="10" text-anchor="middle">[Token_t]</text>

      <rect x="170" y="0" width="70" height="30" rx="4" fill="#201138" stroke="#4a2278" />
      <text x="205" y="19" fill="#a855f7" font-family="monospace" font-size="10" text-anchor="middle">[Token_t+1]</text>

      <!-- LSTM Cell Block -->
      <rect x="0" y="45" width="240" height="65" rx="6" fill="#170c2a" stroke="#581c87" />
      <text x="15" y="65" fill="#f472b6" font-family="monospace" font-size="9">Forget Gate [f_t]  •  Input Gate [i_t]</text>
      <text x="15" y="85" fill="#c084fc" font-family="monospace" font-size="9">Cell State [C_t]   •  Output Gate [o_t]</text>
      <text x="15" y="102" fill="#34d399" font-family="monospace" font-size="9">Hidden Representation Vector [h_t]</text>
    </g>

    <!-- Sentiment Distribution -->
    <rect x="410" y="135" width="245" height="200" rx="8" fill="#0f071d" stroke="#2a1545" stroke-width="1" />
    <text x="425" y="160" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">TEXT SENTIMENT DETECTOR</text>

    <g transform="translate(425, 175)">
      <rect x="0" y="0" width="215" height="42" rx="6" fill="#200b21" stroke="#581c87" />
      <text x="12" y="17" fill="#f43f5e" font-family="sans-serif" font-size="9">Cyberbullying Detected</text>
      <text x="12" y="32" fill="#f43f5e" font-family="monospace" font-size="13" font-weight="bold">HIGH RISK: 94.2%</text>

      <rect x="0" y="52" width="215" height="42" rx="6" fill="#140f2b" stroke="#3b1d63" />
      <text x="12" y="69" fill="#a1a1aa" font-family="sans-serif" font-size="9">Non-Toxic Text Context</text>
      <text x="12" y="84" fill="#a1a1aa" font-family="monospace" font-size="13" font-weight="bold">BASELINE: 5.8%</text>

      <text x="0" y="125" fill="#c084fc" font-family="monospace" font-size="10">● Model: LSTM Neural Net</text>
      <text x="0" y="139" fill="#a1a1aa" font-family="sans-serif" font-size="9">NLP Tokenizer &amp; Stopword Filter</text>
    </g>
  </g>
</svg>