<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2a" />
      <stop offset="100%" stop-color="#060b11" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)" />
  <circle cx="650" cy="120" r="160" fill="#a855f7" opacity="0.08" filter="blur(40px)" />
  <circle cx="150" cy="350" r="140" fill="#ec4899" opacity="0.06" filter="blur(40px)" />

  <g transform="translate(60, 45)">
    <rect width="680" height="360" rx="12" fill="#0f111a" stroke="#2e1065" stroke-width="1.5" />
    
    <line x1="0" y1="40" x2="680" y2="40" stroke="#1f1d2e" stroke-width="1" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="230" y="11" width="220" height="18" rx="6" fill="#06070a" stroke="#2e1065" />
    <text x="340" y="24" fill="#a855f7" font-family="monospace" font-size="10" text-anchor="middle">api-gateway-status: 200 OK</text>

    <!-- Terminal code look -->
    <rect x="30" y="65" width="620" height="270" rx="8" fill="#06070c" stroke="#1f1d2e" />
    <text x="50" y="95" fill="#a855f7" font-family="monospace" font-size="12">[INFO] Rate Limiter initialized: Redis Cluster connected</text>
    <text x="50" y="125" fill="#38bdf8" font-family="monospace" font-size="12">GET /v1/telemetry/stream → 200 OK (latency: 12ms)</text>
    <text x="50" y="155" fill="#34d399" font-family="monospace" font-size="12">POST /v1/auth/exchange → 201 CREATED (cache: HIT)</text>
    <text x="50" y="185" fill="#e2e8f0" font-family="monospace" font-size="12">UPTIME: 99.998% | ACTIVE PROXIES: 48 | THRUPUT: 12.4k req/sec</text>

    <!-- Visual network nodes diagram -->
    <g transform="translate(50, 220)">
      <rect x="0" y="0" width="120" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" />
      <text x="60" y="30" fill="#c7d2fe" font-family="sans-serif" font-size="11" text-anchor="middle">Client Edge</text>
      
      <line x1="120" y1="25" x2="200" y2="25" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" />
      
      <rect x="200" y="0" width="160" height="50" rx="6" fill="#3b0764" stroke="#c084fc" />
      <text x="280" y="30" fill="#f3e8ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Gateway Core</text>

      <line x1="360" y1="25" x2="440" y2="25" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" />

      <rect x="440" y="0" width="140" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" />
      <text x="510" y="30" fill="#c7d2fe" font-family="sans-serif" font-size="11" text-anchor="middle">Microservices</text>
    </g>
  </g>
</svg>

