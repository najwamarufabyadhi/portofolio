<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgData" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B11" />
      <stop offset="50%" stop-color="#0c1a2e" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>
    <linearGradient id="chartGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e4e7a" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgData)" />
  <circle cx="680" cy="90" r="150" fill="#06b6d4" opacity="0.08" filter="blur(40px)" />
  <circle cx="120" cy="360" r="150" fill="#8b5cf6" opacity="0.08" filter="blur(40px)" />

  <!-- App Window Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="360" rx="12" fill="#080e18" stroke="#172a3d" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <line x1="0" y1="40" x2="680" y2="40" stroke="#172a3d" stroke-width="1" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="230" y="11" width="220" height="18" rx="6" fill="#030712" stroke="#172a3d" />
    <text x="340" y="24" fill="#79c0ff" font-family="monospace" font-size="10" text-anchor="middle">data-analytics-ml.vercel.app</text>

    <!-- Top Metrics -->
    <rect x="25" y="55" width="145" height="65" rx="8" fill="#0f1b2b" stroke="#1e3a5f" stroke-width="1" />
    <text x="40" y="75" fill="#8b949e" font-family="sans-serif" font-size="10">RECORDS ANALYZED</text>
    <text x="40" y="102" fill="#e6edf3" font-family="monospace" font-size="18" font-weight="bold">124,580</text>

    <rect x="185" y="55" width="145" height="65" rx="8" fill="#0f1b2b" stroke="#1e3a5f" stroke-width="1" />
    <text x="200" y="75" fill="#8b949e" font-family="sans-serif" font-size="10">CNN ACCURACY</text>
    <text x="200" y="102" fill="#34d399" font-family="monospace" font-size="18" font-weight="bold">96.84%</text>

    <rect x="345" y="55" width="145" height="65" rx="8" fill="#0f1b2b" stroke="#1e3a5f" stroke-width="1" />
    <text x="360" y="75" fill="#8b949e" font-family="sans-serif" font-size="10">INFERENCE TIME</text>
    <text x="360" y="102" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold">&lt; 32 ms</text>

    <rect x="505" y="55" width="150" height="65" rx="8" fill="#0f1b2b" stroke="#1e3a5f" stroke-width="1" />
    <text x="520" y="75" fill="#8b949e" font-family="sans-serif" font-size="10">DATA CORRELATION</text>
    <text x="520" y="102" fill="#c084fc" font-family="monospace" font-size="18" font-weight="bold">r = 0.89</text>

    <!-- Main Chart Panel: Loss & Convergence Curve -->
    <g transform="translate(25, 135)">
      <rect width="400" height="205" rx="8" fill="#060b11" stroke="#172a3d" stroke-width="1" />
      <text x="20" y="25" fill="#e6edf3" font-family="sans-serif" font-size="11" font-weight="bold">Deep Learning Convergence &amp; Loss</text>
      
      <!-- Grid lines -->
      <line x1="20" y1="50" x2="380" y2="50" stroke="#172a3d" stroke-dasharray="3" />
      <line x1="20" y1="95" x2="380" y2="95" stroke="#172a3d" stroke-dasharray="3" />
      <line x1="20" y1="140" x2="380" y2="140" stroke="#172a3d" stroke-dasharray="3" />
      <line x1="20" y1="185" x2="380" y2="185" stroke="#172a3d" stroke-width="1.5" />

      <!-- Area Gradient Curve -->
      <path d="M 20 170 Q 80 150, 140 100 T 260 65 T 380 45 L 380 185 L 20 185 Z" fill="url(#chartGradCyan)" opacity="0.2" />
      <path d="M 20 170 Q 80 150, 140 100 T 260 65 T 380 45" fill="none" stroke="url(#chartGradCyan)" stroke-width="3" stroke-linecap="round" />
      
      <!-- Dots -->
      <circle cx="140" cy="100" r="4" fill="#06b6d4" />
      <circle cx="260" cy="65" r="4" fill="#3b82f6" />
      <circle cx="380" cy="45" r="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
      <text x="360" y="35" fill="#79c0ff" font-family="monospace" font-size="10">96.8%</text>
    </g>

    <!-- Right Sub-panel: Feature Clustering Bar Chart -->
    <g transform="translate(440, 135)">
      <rect width="215" height="205" rx="8" fill="#060b11" stroke="#172a3d" stroke-width="1" />
      <text x="15" y="25" fill="#e6edf3" font-family="sans-serif" font-size="11" font-weight="bold">Feature Importance (RFM)</text>

      <!-- Bar items -->
      <text x="15" y="55" fill="#8b949e" font-family="monospace" font-size="9">Recency</text>
      <rect x="15" y="62" width="185" height="12" rx="3" fill="#172a3d" />
      <rect x="15" y="62" width="160" height="12" rx="3" fill="url(#barGrad)" />

      <text x="15" y="95" fill="#8b949e" font-family="monospace" font-size="9">Frequency</text>
      <rect x="15" y="102" width="185" height="12" rx="3" fill="#172a3d" />
      <rect x="15" y="102" width="135" height="12" rx="3" fill="url(#barGrad)" />

      <text x="15" y="135" fill="#8b949e" font-family="monospace" font-size="9">Monetary Value</text>
      <rect x="15" y="142" width="185" height="12" rx="3" fill="#172a3d" />
      <rect x="15" y="142" width="175" height="12" rx="3" fill="url(#barGrad)" />

      <text x="15" y="175" fill="#8b949e" font-family="monospace" font-size="9">Churn Risk Score</text>
      <rect x="15" y="182" width="185" height="12" rx="3" fill="#172a3d" />
      <rect x="15" y="182" width="95" height="12" rx="3" fill="#ef4444" opacity="0.8" />
    </g>
  </g>
</svg>

