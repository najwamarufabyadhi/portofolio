<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B11" />
      <stop offset="50%" stop-color="#091422" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>
    <radialGradient id="ogBlue" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#1E4E7A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#060B11" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ogCrimson" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8C1123" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#060B11" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#ogBlue)" />
  <rect width="1200" height="630" fill="url(#ogCrimson)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="#172A3D" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Monogram & Meta Badge -->
  <g transform="translate(100, 80)">
    <rect width="50" height="50" rx="8" fill="#0F2744" stroke="#172A3D" />
    <path d="M 12 38 L 12 12 L 25 30 L 38 12 L 38 38 L 32 38 L 32 21 L 25 31 L 18 21 L 18 38 Z" fill="#E6EDF3" />
    <text x="70" y="32" fill="#79C0FF" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="14" font-weight="bold" letter-spacing="3">FEDERATED DEVELOPER HUB // 2025</text>
  </g>

  <!-- Main Hero Typography -->
  <g transform="translate(100, 240)">
    <text x="0" y="0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">MUHAMMAD NAJWA MARUF</text>
    <text x="0" y="60" fill="#79C0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700">ABYADHI</text>

    <!-- Subtitle Role Pill -->
    <rect x="0" y="100" width="360" height="40" rx="8" fill="#8C1123" />
    <text x="20" y="125" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="2">■ FULL STACK SOFTWARE ENGINEER</text>

    <text x="0" y="180" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">
      Production web apps, low-latency microservices, and live interactive Vercel demos.
    </text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#020406" stroke="#172A3D" />
    <text x="65" y="22" fill="#E6EDF3" font-family="monospace" font-size="12" text-anchor="middle">NEXT.JS 14</text>

    <rect x="145" y="0" width="130" height="34" rx="17" fill="#020406" stroke="#172A3D" />
    <text x="210" y="22" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">TYPESCRIPT</text>

    <rect x="290" y="0" width="130" height="34" rx="17" fill="#020406" stroke="#172A3D" />
    <text x="355" y="22" fill="#34D399" font-family="monospace" font-size="12" text-anchor="middle">VERCEL CI/CD</text>

    <rect x="435" y="0" width="140" height="34" rx="17" fill="#020406" stroke="#172A3D" />
    <text x="505" y="22" fill="#F43F5E" font-family="monospace" font-size="12" text-anchor="middle">LIGHTHOUSE 100</text>
  </g>
</svg>

