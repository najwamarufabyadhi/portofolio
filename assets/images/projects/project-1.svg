<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chart1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)" />
  <circle cx="700" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="blur(40px)" />
  <circle cx="100" cy="380" r="160" fill="#818cf8" opacity="0.07" filter="blur(40px)" />

  <!-- App Window Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="360" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <line x1="0" y1="40" x2="680" y2="40" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="230" y="11" width="220" height="18" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="340" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">expense-tracker.vercel.app</text>

    <!-- Sidebar Mini -->
    <rect x="15" y="55" width="130" height="290" rx="8" fill="#0f172a" opacity="0.7" />
    <rect x="30" y="75" width="80" height="10" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="30" y="105" width="95" height="8" rx="3" fill="#475569" />
    <rect x="30" y="125" width="85" height="8" rx="3" fill="#475569" />
    <rect x="30" y="145" width="90" height="8" rx="3" fill="#475569" />
    <rect x="30" y="165" width="70" height="8" rx="3" fill="#475569" />

    <!-- Dashboard Content Area -->
    <!-- Metric Cards -->
    <rect x="160" y="55" width="155" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="175" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Balance</text>
    <text x="175" y="105" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">$24,580.00</text>

    <rect x="330" y="55" width="155" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="345" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Monthly Inflow</text>
    <text x="345" y="105" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="bold">+$8,420.50</text>

    <rect x="500" y="55" width="165" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="515" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Savings Rate</text>
    <text x="515" y="105" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">38.4%</text>

    <!-- Chart Panel -->
    <rect x="160" y="140" width="505" height="205" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="180" y="168" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Cash Flow &amp; Expense Velocity</text>
    
    <!-- Area Chart Path -->
    <path d="M 180 300 Q 230 250, 280 270 T 380 220 T 480 240 T 580 190 L 640 210 L 640 310 L 180 310 Z" fill="url(#chart1)" opacity="0.25" />
    <path d="M 180 300 Q 230 250, 280 270 T 380 220 T 480 240 T 580 190 L 640 210" fill="none" stroke="url(#chart1)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Dots on chart -->
    <circle cx="280" cy="270" r="4" fill="#38bdf8" />
    <circle cx="380" cy="220" r="4" fill="#818cf8" />
    <circle cx="480" cy="240" r="4" fill="#38bdf8" />
    <circle cx="580" cy="190" r="5" fill="#ffffff" stroke="#818cf8" stroke-width="2" />
  </g>
</svg>

