<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)" />
  <circle cx="680" cy="100" r="150" fill="#10b981" opacity="0.08" filter="blur(40px)" />
  <circle cx="120" cy="350" r="160" fill="#06b6d4" opacity="0.06" filter="blur(40px)" />

  <!-- App Window Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="360" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <line x1="0" y1="40" x2="680" y2="40" stroke="#1e293b" stroke-width="1" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="230" y="11" width="220" height="18" rx="6" fill="#030712" stroke="#1e293b" />
    <text x="340" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">corporate-cms.vercel.app</text>

    <!-- Nav Bar Inside App -->
    <rect x="35" y="60" width="80" height="12" rx="3" fill="#34d399" />
    <rect x="440" y="62" width="45" height="8" rx="3" fill="#64748b" />
    <rect x="500" y="62" width="45" height="8" rx="3" fill="#64748b" />
    <rect x="560" y="62" width="45" height="8" rx="3" fill="#64748b" />
    <rect x="620" y="58" width="40" height="16" rx="4" fill="url(#btnGrad)" />

    <!-- Hero Content in App -->
    <rect x="35" y="100" width="120" height="16" rx="8" fill="#10b981" opacity="0.2" />
    <text x="45" y="112" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">HEADLESS CMS INTEGRATION</text>
    
    <text x="35" y="145" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">Elevating Modern Enterprise</text>
    <text x="35" y="170" fill="#94a3b8" font-family="sans-serif" font-size="13">Static generation delivering 99.9% uptime and &lt; 80ms TTFB.</text>
    
    <rect x="35" y="195" width="105" height="28" rx="6" fill="url(#btnGrad)" />
    <text x="87" y="213" fill="#042f2e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Explore Solutions</text>

    <!-- Right Side Cards / Grids -->
    <g transform="translate(360, 100)">
      <rect width="280" height="225" rx="10" fill="url(#cardGrad2)" stroke="#047857" stroke-width="1" />
      <rect x="20" y="20" width="240" height="85" rx="6" fill="#022c22" stroke="#065f46" stroke-width="1" />
      <circle cx="45" cy="45" r="14" fill="#10b981" opacity="0.3" />
      <text x="70" y="45" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Dynamic Content Delivery</text>
      <text x="70" y="62" fill="#94a3b8" font-family="sans-serif" font-size="10">Webhooks synced in real-time</text>

      <rect x="20" y="120" width="112" height="85" rx="6" fill="#022c22" stroke="#065f46" stroke-width="1" />
      <text x="35" y="145" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="bold">99/100</text>
      <text x="35" y="165" fill="#94a3b8" font-family="sans-serif" font-size="10">Lighthouse SEO</text>

      <rect x="148" y="120" width="112" height="85" rx="6" fill="#022c22" stroke="#065f46" stroke-width="1" />
      <text x="163" y="145" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">&lt; 150ms</text>
      <text x="163" y="165" fill="#94a3b8" font-family="sans-serif" font-size="10">Render Time</text>
    </g>
  </g>
</svg>

